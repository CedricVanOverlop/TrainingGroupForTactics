# Continuous integration: every push to main and every pull request
# must build and pass all tests. The tests are the security mechanism
# of the project (isolation, architecture, hostile modules): never
# disable or bypass a job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TGFT.slnx

      - name: Build
        run: dotnet build TGFT.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test TGFT.slnx --no-build --configuration Release

      # Fails the job if any direct or transitive package has a known vulnerability.
      - name: Check vulnerable packages
        run: |
          dotnet list TGFT.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false
